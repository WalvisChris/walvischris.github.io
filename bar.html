<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cayo Perico Heist</title>
    <style>
        body {
            background-color: #121212; 
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white; /* Zorgt dat de tekst leesbaar is op zwart */
        }

        /* Nieuwe container om alles netjes onder elkaar te houden */
        .container {
            width: 80%; /* Of een vaste breedte zoals 600px */
            max-width: 800px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background-color: #333; /* Iets donkerder grijs voor de lege bar */
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #444;
        }

        .segment {
            height: 100%;
        }

        .blue { background-color: #3498db; }
        .red  { background-color: #e74c3c; }
        .green { background-color: #2ecc71; }

        .legend {
            list-style: none;
            display: flex;
            flex-wrap: wrap; /* Zorgt dat de legenda op mobiel naar de volgende regel gaat */
            gap: 20px;
            padding: 0;
            margin-top: 20px;
        }

        .legend li {
            display: flex;
            align-items: center;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            display: inline-block;
        }

        .dot.blue  { background-color: #3498db; }
        .dot.red   { background-color: #e74c3c; }
        .dot.green { background-color: #2ecc71; }
        .dot.empty { background-color: #333; border: 1px solid #555; }
    </style>
</head>
<body>

    <!-- De container houdt de bar en legenda bij elkaar -->
    <div class="container">
        <div class="progress-bar">
            <div class="segment blue" style="width: 50%;"></div>
            <div class="segment red" style="width: 10%;"></div>
            <div class="segment green" style="width: 5%;"></div>
        </div>

        <ul class="legend">
            <li><span class="dot blue"></span> Blauw (50%)</li>
            <li><span class="dot red"></span> Rood (10%)</li>
            <li><span class="dot green"></span> Groen (5%)</li>
            <li><span class="dot empty"></span> Leeg (35%)</li>
        </ul>
    </div>

</body>
</html>
