<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Goal Tunes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f;
            --surface: #17171b;
            --border: #2a2a30;
            --text: #f2f2f2;
            --muted: #8a8a93;
            --accent: #fbdc2c;
            --accent-dark: #e0c21a;
            --blue: #3b82f6;
            --blue-dark: #2563eb;
            --pink: #ec4899;
            --pink-dark: #db2777;
            --danger: #e5484d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 50% 0%, #1c1a10 0%, var(--bg) 55%);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
            gap: 14px;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        button { font: inherit; touch-action: manipulation; cursor: pointer; }

        /* Bovenbalk */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .back-link:active { color: var(--accent); }
        .title { font-weight: 800; font-size: 1.1rem; }
        .title span { color: var(--accent); }
        .spacer { width: 52px; }

        /* Score + grote knop */
        .scoreboard {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
        }
        .score {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .score-value {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text);
            font-size: clamp(2.8rem, 15vw, 4rem);
            font-weight: 800;
            line-height: 1;
            padding: 14px 0;
            font-variant-numeric: tabular-nums;
            transition: transform 0.1s;
        }
        .score-value:active { transform: scale(0.95); }
        .score.home .score-value { color: var(--accent); border-color: rgba(251, 220, 44, 0.4); }
        .score-minus {
            width: 40px;
            height: 32px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 1.2rem;
            font-weight: 700;
        }
        .score-minus:active { color: var(--text); border-color: var(--muted); }

        .goal-btn {
            width: clamp(120px, 38vw, 170px);
            aspect-ratio: 1;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #111;
            font-size: clamp(1.1rem, 5vw, 1.4rem);
            font-weight: 800;
            line-height: 1.1;
            box-shadow: 0 0 0 6px rgba(251, 220, 44, 0.15), 0 10px 30px rgba(251, 220, 44, 0.3);
            transition: transform 0.1s, background 0.15s;
        }
        .goal-btn:active { transform: scale(0.94); background: var(--accent-dark); }
        .goal-btn small {
            display: block;
            font-size: 0.6em;
            font-weight: 600;
            opacity: 0.7;
            margin-top: 4px;
        }
        /* Zodra er iets speelt: rode stopknop */
        .goal-btn .label-stop { display: none; }
        .goal-btn.stop {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 0 6px rgba(229, 72, 77, 0.18), 0 10px 30px rgba(229, 72, 77, 0.35);
            animation: none;
        }
        .goal-btn.stop:active { background: #c93b40; }
        .goal-btn.stop .label-goal { display: none; }
        .goal-btn.stop .label-stop {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .stop-icon {
            width: 0.9em;
            height: 0.9em;
            border-radius: 3px;
            background: currentColor;
        }

        /* 2x2 grid */
        .tune-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 14px;
            min-height: 0;
        }
        .tune-btn {
            position: relative;
            overflow: hidden;
            border: none;
            border-radius: 20px;
            padding: 6px 6px 0;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 0;
            -webkit-touch-callout: none;
            transition: transform 0.1s, filter 0.15s;
        }
        .tune-btn:active { transform: scale(0.96); filter: brightness(0.9); }
        .tune-btn.boy  { background: linear-gradient(160deg, var(--blue), var(--blue-dark)); }
        .tune-btn.girl { background: linear-gradient(160deg, var(--pink), var(--pink-dark)); }
        .tune-btn .name {
            flex: 0 0 auto;
            padding: 8px 4px 10px;
            font-size: clamp(0.95rem, 4.4vw, 1.15rem);
            font-weight: 800;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Foto (vierkant 1024x1024), vult zoveel mogelijk van de knop */
        .photo {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.25);
        }
        .photo img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            pointer-events: none;
            -webkit-user-drag: none;
        }
        /* Geen foto: alleen de naam, groot in het vlak */
        .photo .fallback-name {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 8px;
            text-align: center;
            font-size: clamp(1.4rem, 7vw, 2rem);
            font-weight: 800;
            line-height: 1.1;
            color: #fff;
            overflow-wrap: anywhere;
        }
        .photo.no-img .fallback-name { display: flex; }
        /* Zonder foto staat de naam al in het vlak, dus het label eronder weg */
        .no-photo > .name { display: none; }
        .tune-btn.no-photo { padding-bottom: 6px; }
        .player-btn.no-photo { padding-bottom: 4px; }
        /* Vul-animatie tijdens ingedrukt houden */
        .tune-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.18);
            transform: scaleY(0);
            transform-origin: bottom;
            pointer-events: none;
        }
        .tune-btn.holding::after {
            transform: scaleY(1);
            transition: transform 0.5s linear;
        }

        /* ===== Spelers-overlay ===== */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .overlay.open { opacity: 1; pointer-events: auto; }
        .sheet {
            width: 100%;
            max-height: 85dvh;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-top: 3px solid var(--sheet-color, var(--accent));
            border-radius: 22px 22px 0 0;
            padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
            transform: translateY(100%);
            transition: transform 0.25s ease-out;
        }
        .overlay.open .sheet { transform: translateY(0); }
        .overlay.heren { --sheet-color: var(--blue); }
        .overlay.dames { --sheet-color: var(--pink); }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .sheet-header h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--sheet-color);
        }
        .close-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .team-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
        }
        .team-tabs::-webkit-scrollbar { display: none; }
        .team-tab {
            flex: 0 0 auto;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.88rem;
            white-space: nowrap;
        }
        .team-tab.active {
            background: var(--sheet-color);
            border-color: var(--sheet-color);
            color: #fff;
        }

        .player-list {
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding-bottom: 4px;
        }
        .player-btn {
            padding: 4px 4px 0;
            border-radius: 14px;
            border: 2px solid transparent;
            background: #1f1f24;
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-width: 0;
            transition: transform 0.1s, border-color 0.15s;
        }
        .player-btn:active { transform: scale(0.97); border-color: var(--sheet-color); }
        .player-btn.current { border-color: var(--sheet-color); }
        .player-btn .photo {
            flex: none;
            aspect-ratio: 1;
            border-radius: 10px;
            background: var(--sheet-color);
        }
        .player-btn .photo .fallback-name { font-size: 1rem; padding: 6px; }
        .player-btn .name {
            padding: 7px 2px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .empty {
            grid-column: 1 / -1;
            color: var(--muted);
            text-align: center;
            padding: 24px 0;
        }

        /* Speelt-af status */
        .playing {
            animation: pulse 0.9s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.5); }
            50%      { box-shadow: 0 0 0 8px rgba(255, 255, 255, 0); }
        }

        .now-playing {
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
            min-height: 1.2em;
            margin-top: -6px;
        }

        /* ===== Aanval / Verdediging ===== */
        .vak-row { display: flex; justify-content: center; }
        .segmented {
            display: inline-flex;
            padding: 3px;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .segmented button {
            border: none;
            background: transparent;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 7px 18px;
            border-radius: 999px;
            transition: background 0.2s, color 0.2s;
        }
        .segmented button.active {
            background: var(--accent);
            color: #111;
        }
        /* Korte animatie als het vak wisselt */
        .tune-grid.switching .tune-btn { animation: vakwissel 0.45s ease; }
        @keyframes vakwissel {
            0%   { transform: scale(1); opacity: 1; }
            40%  { transform: scale(0.92); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ===== Knoppen onderaan ===== */
        .bottom-bar {
            display: flex;
            gap: 10px;
        }
        .small-btn {
            flex: 1;
            height: 42px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-weight: 600;
            font-size: 0.9rem;
            transition: transform 0.1s, border-color 0.15s;
        }
        .small-btn:active { transform: scale(0.97); border-color: var(--accent); }
        .small-btn.reset {
            flex: 0 0 auto;
            padding: 0 20px;
            color: var(--danger);
            border-color: rgba(229, 72, 77, 0.4);
        }
        .small-btn.reset:active { border-color: var(--danger); }
        .small-btn.start {
            flex: 0 0 auto;
            min-width: 84px;
            padding: 0 16px;
            color: var(--accent);
            border-color: rgba(251, 220, 44, 0.45);
            font-variant-numeric: tabular-nums;
        }
        .small-btn.start.running {
            background: rgba(251, 220, 44, 0.12);
        }

        /* ===== Wedstrijdoverzicht ===== */
        .overlay.match { --sheet-color: var(--accent); }
        .match-stand {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            padding: 4px 0 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }
        .match-stand .team { font-weight: 600; color: var(--muted); font-size: 0.9rem; }
        .match-stand .team.home { text-align: right; color: var(--accent); }
        .match-stand .nums {
            font-size: 2.4rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }
        .goal-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        /* Elke regel zit in een 'item' met een rode laag eronder voor swipen */
        .goal-item {
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
            flex: none;
        }
        .goal-item:last-child { border-bottom: none; }
        .goal-item.removing {
            transition: height 0.2s ease, opacity 0.2s ease;
            opacity: 0;
        }
        .goal-bg {
            position: absolute;
            inset: 0;
            background: var(--danger);
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            opacity: 0;
        }
        .goal-row {
            position: relative;
            display: grid;
            grid-template-columns: 54px 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 12px 2px;
            background: var(--surface);
            touch-action: pan-y;          /* verticaal scrollen blijft werken */
        }
        .goal-row.snap { transition: transform 0.2s ease; }

        /* Melding na verwijderen */
        .undo-toast {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            background: #1f1f24;
            border: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .undo-toast[hidden] { display: none; }
        .undo-toast button {
            border: none;
            background: none;
            color: var(--accent);
            font-weight: 700;
            font-size: 0.9rem;
            padding: 4px 0;
        }
        .swipe-hint {
            text-align: center;
            color: #5c5c66;
            font-size: 0.75rem;
            margin-top: 8px;
        }
        .goal-row .time { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
        .goal-row.event .who { color: var(--muted); font-weight: 500; font-size: 0.92rem; }
        .goal-row .swap { color: var(--text); font-weight: 600; }
        .goal-row .icon {
            flex: none;
            width: 18px;
            text-align: center;
            font-size: 0.95rem;
            color: var(--muted);
        }
        .goal-row.start .who { color: var(--accent); font-weight: 600; }
        .goal-row.start .icon { color: var(--accent); }
        .match-meta {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            margin: -6px 0 10px;
        }
        .goal-row .who {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            min-width: 0;
        }
        .goal-row .who .naam { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        /* Balletje met hoeveelste doelpunt van deze speler */
        .goal-count {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 2px;
            padding: 2px 8px 2px 5px;
            border-radius: 999px;
            background: rgba(251, 220, 44, 0.12);
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .goal-count svg { width: 14px; height: 14px; display: block; }
        .goal-row .dot {
            flex: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
        }
        .goal-row .dot.heren { background: var(--blue); }
        .goal-row .dot.dames { background: var(--pink); }
        .goal-row .dot.away  { background: var(--muted); }
        .goal-row.away .who { color: var(--muted); }
        .goal-row .stand {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--muted);
        }
        .goal-row .stand b { color: var(--text); }
        .goal-row.home .stand b { color: var(--accent); }
    </style>
</head>
<body>

    <div class="topbar">
        <a class="back-link" href="gemini-tools.html">← Terug</a>
        <div class="title"><span>Goal</span> Tunes</div>
        <div class="spacer"></div>
    </div>

    <div class="scoreboard">
        <div class="score home">
            <button class="score-value" id="score-home" aria-label="Score thuisteam, tik voor +1">0</button>
            <button class="score-minus" data-team="home" aria-label="Score thuisteam -1">−</button>
        </div>

        <button class="goal-btn" id="random-btn" aria-label="Willekeurige goaltune">
            <span class="label-goal">GOAL!<small>willekeurig</small></span>
            <span class="label-stop"><span class="stop-icon"></span>STOP</span>
        </button>

        <div class="score away">
            <button class="score-value" id="score-away" aria-label="Score tegenstander, tik voor +1">0</button>
            <button class="score-minus" data-team="away" aria-label="Score tegenstander -1">−</button>
        </div>
    </div>

    <div class="vak-row">
        <div class="segmented" role="tablist" aria-label="Vak">
            <button type="button" data-profiel="aanval" class="active">Aanval</button>
            <button type="button" data-profiel="verdediging">Verdediging</button>
        </div>
    </div>

    <div class="now-playing" id="now-playing"></div>

    <!-- De vier knoppen worden gevuld vanuit PROFIELEN in het script -->
    <div class="tune-grid" id="tune-grid"></div>

    <div class="bottom-bar">
        <button class="small-btn" id="match-btn">Wedstrijdoverzicht</button>
        <button class="small-btn start" id="start-btn">Start</button>
        <button class="small-btn reset" id="reset-btn">Reset</button>
    </div>

    <!-- Wedstrijdoverzicht-overlay -->
    <div class="overlay match" id="match-overlay" aria-hidden="true">
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="match-title">
            <div class="sheet-header">
                <h2 id="match-title">Wedstrijdoverzicht</h2>
                <button class="close-btn" id="match-close" aria-label="Sluiten">✕</button>
            </div>
            <div class="match-stand">
                <span class="team home">Gemini</span>
                <span class="nums" id="match-nums">0 - 0</span>
                <span class="team">Tegenstander</span>
            </div>
            <div class="match-meta" id="match-meta"></div>
            <div class="goal-list" id="goal-list"></div>
            <div class="undo-toast" id="undo-toast" hidden>
                <span id="undo-text">Verwijderd</span>
                <button type="button" id="undo-btn">Ongedaan maken</button>
            </div>
            <div class="swipe-hint" id="swipe-hint">Veeg een regel opzij om hem te verwijderen</div>
        </div>
    </div>

    <!-- Spelers-overlay -->
    <div class="overlay" id="overlay" aria-hidden="true">
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
            <div class="sheet-header">
                <h2 id="sheet-title">Heren</h2>
                <button class="close-btn" id="close-btn" aria-label="Sluiten">✕</button>
            </div>
            <div class="team-tabs" id="team-tabs"></div>
            <div class="player-list" id="player-list"></div>
        </div>
    </div>

<script>
    // ===== CONFIGURATIE =====
    // 'random' is de lijst waar de grote GOAL-knop willekeurig uit kiest.
    // Spelers zonder eigen tune krijgen ook een tune uit deze lijst.
    const TUNES = {
        random: [
            'assets/tunes/tune_default_1.mp3',
            'assets/tunes/tune_default_2.mp3',
            'assets/tunes/tune_default_3.mp3',
            'assets/tunes/tune_default_4.mp3',
            'assets/tunes/tune_default_5.mp3',
            'assets/tunes/tune_default_6.mp3'
        ]
    };

    // Spelers per team.
    // foto: pad naar de foto (1024x1024). Leeg ('') = alleen de naam tonen.
    // tune: pad naar de mp3. Leeg ('') of -1 = willekeurige tune uit TUNES.random.
    const TEAMS = ['Gemini 1', 'Gemini 2', 'Gemini 3', 'Gemini J1', 'Extra'];
    const SPELERS = {
        heren: {
            'Gemini 1': [
                { naam: 'Christiaan', foto: 'assets/players/pfp_christiaan.png', tune: '' },
                { naam: 'Nando', foto: 'assets/players/pfp_nando.png', tune: 'assets/tunes/tune_nando.mp3' },
                { naam: 'Robbin', foto: 'assets/players/pfp_robbin.png', tune: 'assets/tunes/tune_robbin.mp3' },
                { naam: 'Rick', foto: 'assets/players/pfp_rick.png', tune: 'assets/tunes/tune_rick.mp3' },
                { naam: 'Loek', foto: 'assets/players/pfp_loek.png', tune: 'assets/tunes/tune_loek.mp3' }
            ],
            'Gemini 2': [
                { naam: 'Davy', foto: 'assets/players/pfp_davy.png', tune: 'assets/tunes/tune_davy.mp3' },

                { naam: 'Geertje', foto: 'assets/players/pfp_geertje.png', tune: '' },
                { naam: 'Fenna', foto: 'assets/players/pfp_fenna.png', tune: '' },
                { naam: 'Laura', foto: 'assets/players/pfp_laura.png', tune: '' },
                { naam: 'Esther', foto: 'assets/players/pfp_esther.png', tune: '' },
                { naam: 'Ingrid', foto: 'assets/players/pfp_ingrid.png', tune: '' },
                { naam: 'Zoe', foto: 'assets/players/pfp_zoe.png', tune: '' }
            ]
        }
    };

    // De vier grote knoppen: links boven, rechts boven, links onder, rechts onder.
    // Links staan heren, rechts dames. Er zijn twee profielen (vakken) met elk vier spelers.
    // Dit is de beginopstelling; wissels via vasthouden worden per profiel onthouden.
    const KNOP_GROEPEN = ['heren', 'dames', 'heren', 'dames'];
    const PROFIELEN = {
        aanval:      ['Nando', 'Eva', 'Robbin', 'Nanda'],
        verdediging: ['Rick', 'Madelief', 'Loek', 'Suzanne']
    };
    const PROFIEL_NAMEN = ['aanval', 'verdediging']; // de wedstrijd begint in de aanval

    // Zoekt een speler op naam in SPELERS (zodat foto en tune maar op één plek staan)
    function zoekSpeler(groep, naam) {
        for (const team of Object.values(SPELERS[groep] || {})) {
            const s = team.find(p => p.naam.toLowerCase() === naam.toLowerCase());
            if (s) return s;
        }
        return { naam, foto: '', tune: '' };
    }

    // ===== FOTO MET NAAM =====
    // Zonder foto (of als de foto niet laadt) komt de naam groot in het vlak te staan.
    function vulKaart(knop, speler) {
        const wrap = document.createElement('div');
        wrap.className = 'photo';
        const fallback = document.createElement('span');
        fallback.className = 'fallback-name';
        fallback.textContent = speler.naam;

        const geenFoto = () => { wrap.classList.add('no-img'); knop.classList.add('no-photo'); };

        if (speler.foto) {
            const img = document.createElement('img');
            img.src = speler.foto;
            img.alt = '';
            img.loading = 'lazy';
            img.decoding = 'async';
            img.addEventListener('error', () => { img.remove(); geenFoto(); });
            wrap.appendChild(img);
        } else {
            geenFoto();
        }
        wrap.appendChild(fallback);

        const label = document.createElement('span');
        label.className = 'name';
        label.textContent = speler.naam;

        knop.appendChild(wrap);
        knop.appendChild(label);
    }

    // ===== GRID MET TWEE PROFIELEN =====
    const tuneGrid = document.getElementById('tune-grid');
    const gridKnoppen = [];

    function bestaatSpeler(groep, naam) {
        return Object.values(SPELERS[groep] || {}).some(team => team.some(p => p.naam === naam));
    }

    // Opstelling per profiel laden (met de standaard uit PROFIELEN als basis)
    const opstelling = { aanval: [...PROFIELEN.aanval], verdediging: [...PROFIELEN.verdediging] };
    try {
        const opgeslagen = JSON.parse(localStorage.getItem('goaltunes-knoppen'));
        // Oude opslag (één lijst van vier) hoort bij de aanval
        const bron = Array.isArray(opgeslagen) ? { aanval: opgeslagen } : (opgeslagen || {});
        PROFIEL_NAMEN.forEach(prof => {
            (bron[prof] || []).forEach((naam, i) => {
                if (i < 4 && bestaatSpeler(KNOP_GROEPEN[i], naam)) opstelling[prof][i] = naam;
            });
        });
    } catch (e) {}

    function bewaarOpstelling() {
        try { localStorage.setItem('goaltunes-knoppen', JSON.stringify(opstelling)); } catch (e) {}
    }

    // Handmatig wisselen draait het profiel om ten opzichte van de automatische wissel
    let profielOmgedraaid = false;
    try { profielOmgedraaid = localStorage.getItem('goaltunes-profiel-omgedraaid') === '1'; } catch (e) {}
    let getoondProfiel = null;

    KNOP_GROEPEN.forEach((groep, i) => {
        const btn = document.createElement('button');
        btn.className = 'tune-btn ' + (groep === 'dames' ? 'girl' : 'boy');
        btn.dataset.groep = groep;
        btn.dataset.plek = i;
        tuneGrid.appendChild(btn);
        gridKnoppen.push(btn);
    });

    function toonSpelerOpKnop(btn, speler) {
        btn._speler = speler;
        btn.setAttribute('aria-label', speler.naam);
        btn.classList.remove('no-photo');
        btn.replaceChildren();
        vulKaart(btn, speler);
    }

    // Na elke twee doelpunten (samen) wisselt het vak: 0-1 aanval, 2-3 verdediging, enz.
    function huidigProfiel() {
        const stand = telStand();
        const wissels = Math.floor((stand.home + stand.away) / 2);
        return PROFIEL_NAMEN[(wissels + (profielOmgedraaid ? 1 : 0)) % 2];
    }

    function toonProfiel(profiel, animeer) {
        getoondProfiel = profiel;
        gridKnoppen.forEach((btn, i) => {
            toonSpelerOpKnop(btn, zoekSpeler(KNOP_GROEPEN[i], opstelling[profiel][i]));
        });
        document.querySelectorAll('.segmented button').forEach(b => {
            const actief = b.dataset.profiel === profiel;
            b.classList.toggle('active', actief);
            b.setAttribute('aria-selected', actief);
        });
        if (animeer) {
            tuneGrid.classList.remove('switching');
            void tuneGrid.offsetWidth; // animatie opnieuw starten
            tuneGrid.classList.add('switching');
        }
    }

    // Wordt aangeroepen na elke wijziging in de score
    function werkProfielBij() {
        const profiel = huidigProfiel();
        if (profiel !== getoondProfiel) toonProfiel(profiel, getoondProfiel !== null);
    }

    // Handmatig wisselen met de knoppen Aanval / Verdediging
    document.querySelectorAll('.segmented button').forEach(b => {
        b.addEventListener('click', () => {
            if (b.dataset.profiel === getoondProfiel) return;
            profielOmgedraaid = !profielOmgedraaid;
            try { localStorage.setItem('goaltunes-profiel-omgedraaid', profielOmgedraaid ? '1' : '0'); } catch (e) {}
            werkProfielBij();
        });
    });
    tuneGrid.addEventListener('animationend', () => tuneGrid.classList.remove('switching'));

    // Zet een speler op een knop in het huidige profiel en onthoud dat
    function wijsToe(btn, speler) {
        toonSpelerOpKnop(btn, speler);
        opstelling[getoondProfiel][Number(btn.dataset.plek)] = speler.naam;
        bewaarOpstelling();
    }

    // ===== AFSPELEN =====
    const player = new Audio();
    const nowPlaying = document.getElementById('now-playing');
    let actieveKnop = null;
    let laatsteRandom = null;

    const randomBtn = document.getElementById('random-btn');

    // GOAL-knop wordt een rode stopknop zolang er iets speelt
    function werkStopKnopBij() {
        const speelt = actieveKnop !== null;
        randomBtn.classList.toggle('stop', speelt);
        randomBtn.setAttribute('aria-label', speelt ? 'Stop goaltune' : 'Willekeurige goaltune');
    }

    function stopHuidige() {
        player.pause();
        player.currentTime = 0;
        if (actieveKnop) actieveKnop.classList.remove('playing');
        actieveKnop = null;
        actieveWie = null;
        nowPlaying.textContent = '';
        werkStopKnopBij();
    }

    let actieveWie = null; // welke speler (of 'random') nu speelt

    // Kiest een willekeurige tune uit TUNES.random (nooit twee keer dezelfde achter elkaar)
    function willekeurigeTune() {
        const lijst = TUNES.random;
        if (!lijst.length) return null;
        let keuze;
        do {
            keuze = lijst[Math.floor(Math.random() * lijst.length)];
        } while (lijst.length > 1 && keuze === laatsteRandom);
        laatsteRandom = keuze;
        return keuze;
    }

    // Eigen tune van de speler, of een willekeurige als die leeg of -1 is
    function tuneVoor(speler) {
        const t = speler.tune;
        if (!t || t === -1 || t === '-1') return willekeurigeTune();
        return t;
    }

    // wie = het speler-object, of 'random' voor de GOAL-knop
    function speelAf(wie, knop) {
        // Nogmaals tikken op dezelfde knop voor dezelfde speler = stoppen
        if (actieveKnop === knop && actieveWie === wie && !player.paused) {
            stopHuidige();
            return;
        }
        stopHuidige();
        const src = wie === 'random' ? willekeurigeTune() : tuneVoor(wie);
        if (!src) return;

        player.src = src;
        actieveKnop = knop;
        actieveWie = wie;
        knop.classList.add('playing');
        nowPlaying.textContent = '♪ ' + (wie === 'random' ? 'Goal!' : wie.naam);
        werkStopKnopBij();

        player.play().catch(() => {
            nowPlaying.textContent = 'Kon tune niet afspelen (bestand nog niet gevonden)';
            knop.classList.remove('playing');
            actieveKnop = null;
            actieveWie = null;
            werkStopKnopBij();
        });
    }

    player.addEventListener('ended', stopHuidige);
    player.addEventListener('error', () => {
        if (actieveKnop) {
            actieveKnop.classList.remove('playing');
            actieveKnop = null;
            actieveWie = null;
            nowPlaying.textContent = 'Kon tune niet afspelen (bestand nog niet gevonden)';
            werkStopKnopBij();
        }
    });

    // ===== TIKKEN = AFSPELEN, VASTHOUDEN = SPELERSOVERZICHT =====
    const HOUD_VAST_MS = 500;

    document.querySelectorAll('.tune-btn').forEach(knop => {
        let timer = null;
        let startX = 0, startY = 0;
        let langIngedrukt = false;

        const annuleer = () => {
            clearTimeout(timer);
            timer = null;
            knop.classList.remove('holding');
        };

        knop.addEventListener('pointerdown', (e) => {
            langIngedrukt = false;
            startX = e.clientX;
            startY = e.clientY;
            knop.classList.add('holding');
            timer = setTimeout(() => {
                langIngedrukt = true;
                knop.classList.remove('holding');
                if (navigator.vibrate) navigator.vibrate(30);
                openOverlay(knop.dataset.groep, knop);
            }, HOUD_VAST_MS);
        });

        knop.addEventListener('pointermove', (e) => {
            if (timer && Math.hypot(e.clientX - startX, e.clientY - startY) > 12) annuleer();
        });
        knop.addEventListener('pointerup', annuleer);
        knop.addEventListener('pointerleave', annuleer);
        knop.addEventListener('pointercancel', annuleer);
        knop.addEventListener('contextmenu', (e) => e.preventDefault());

        knop.addEventListener('click', (e) => {
            if (langIngedrukt) {         // was een lange druk, dan niet afspelen
                langIngedrukt = false;
                e.preventDefault();
                return;
            }
            // Tweede tik op dezelfde speler stopt alleen de muziek, dat telt niet als doelpunt
            const gaatStoppen = actieveKnop === knop && actieveWie === knop._speler && !player.paused;
            speelAf(knop._speler, knop);
            if (!gaatStoppen) voegDoelpuntToe('home', knop._speler.naam, knop.dataset.groep);
        });
    });

    // ===== OVERLAY =====
    const overlay = document.getElementById('overlay');
    const sheetTitle = document.getElementById('sheet-title');
    const teamTabs = document.getElementById('team-tabs');
    const playerList = document.getElementById('player-list');
    const actiefTeam = { heren: TEAMS[0], dames: TEAMS[0] }; // onthoudt laatst gekozen tab
    let huidigeGroep = 'heren';
    let bronKnop = null;

    function openOverlay(groep, knop) {
        huidigeGroep = groep;
        bronKnop = knop;
        overlay.classList.remove('heren', 'dames');
        overlay.classList.add(groep, 'open');
        overlay.setAttribute('aria-hidden', 'false');
        sheetTitle.textContent = groep === 'heren' ? 'Heren' : 'Dames';
        renderTabs();
        renderSpelers();
    }

    function sluitOverlay() {
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
    }

    function renderTabs() {
        teamTabs.innerHTML = '';
        TEAMS.forEach(team => {
            const tab = document.createElement('button');
            tab.className = 'team-tab' + (team === actiefTeam[huidigeGroep] ? ' active' : '');
            tab.textContent = team;
            tab.addEventListener('click', () => {
                actiefTeam[huidigeGroep] = team;
                renderTabs();
                renderSpelers();
            });
            teamTabs.appendChild(tab);
        });
        const actief = teamTabs.querySelector('.active');
        if (actief) actief.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    function renderSpelers() {
        const spelers = (SPELERS[huidigeGroep] || {})[actiefTeam[huidigeGroep]] || [];
        playerList.innerHTML = '';
        if (spelers.length === 0) {
            const leeg = document.createElement('div');
            leeg.className = 'empty';
            leeg.textContent = 'Nog geen spelers in dit team';
            playerList.appendChild(leeg);
            return;
        }
        spelers.forEach(speler => {
            const btn = document.createElement('button');
            btn.className = 'player-btn' + (bronKnop && bronKnop._speler.naam === speler.naam ? ' current' : '');
            btn.setAttribute('aria-label', speler.naam);
            vulKaart(btn, speler);
            btn.addEventListener('click', () => {
                if (bronKnop) {
                    const oud = bronKnop._speler;
                    wijsToe(bronKnop, speler);
                    if (oud.naam !== speler.naam) registreerWissel(oud, speler, bronKnop.dataset.groep);
                }
                sluitOverlay();
            });
            playerList.appendChild(btn);
        });
    }

    document.getElementById('close-btn').addEventListener('click', sluitOverlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) sluitOverlay(); });

    randomBtn.addEventListener('click', () => {
        if (actieveKnop) { stopHuidige(); return; }  // stoppen telt niet als doelpunt
        speelAf('random', randomBtn);
        voegDoelpuntToe('away', 'Tegenstander');
    });

    // ===== SCORE & WEDSTRIJDOVERZICHT =====
    // Alles wat er gebeurt (start, doelpunten, wissels) staat in één lijst.
    // De score wordt geteld uit de doelpunten in die lijst.
    const LOG_KEY = 'goaltunes-doelpunten';
    let gebeurtenissen = [];
    try {
        const opgeslagen = JSON.parse(localStorage.getItem(LOG_KEY));
        if (Array.isArray(opgeslagen)) gebeurtenissen = opgeslagen;
    } catch (e) {}
    try { localStorage.removeItem('goaltunes-score'); } catch (e) {} // oude opslag opruimen

    const matchOverlay = document.getElementById('match-overlay');
    const goalList = document.getElementById('goal-list');
    const startBtn = document.getElementById('start-btn');

    const isDoelpunt = g => !g.type || g.type === 'goal';

    function bewaar() {
        try { localStorage.setItem(LOG_KEY, JSON.stringify(gebeurtenissen)); } catch (e) {}
    }

    // Tijdstip van de (laatste) start, of null als de wedstrijd nog niet gestart is
    function startTijd() {
        for (let i = gebeurtenissen.length - 1; i >= 0; i--) {
            if (gebeurtenissen[i].type === 'start') return gebeurtenissen[i].tijd;
        }
        return null;
    }

    function telStand() {
        const stand = { home: 0, away: 0 };
        gebeurtenissen.filter(isDoelpunt).forEach(d => stand[d.team]++);
        return stand;
    }

    // team: 'home' of 'away'. naam: speler (of 'Gemini' / 'Tegenstander'). groep: heren/dames
    function voegDoelpuntToe(team, naam, groep) {
        gebeurtenissen.push({ type: 'goal', team, naam, groep: groep || null, tijd: Date.now() });
        bewaar();
        toonScores();
    }

    // Wissels worden pas bijgehouden zodra de wedstrijd gestart is,
    // zodat het klaarzetten van de opstelling niet in het overzicht komt.
    function registreerWissel(uit, inn, groep) {
        if (startTijd() === null) return;
        gebeurtenissen.push({ type: 'wissel', uit: uit.naam, in: inn.naam, groep, tijd: Date.now() });
        bewaar();
        if (matchOverlay.classList.contains('open')) renderOverzicht();
    }

    // Haalt het laatste doelpunt van dit team weg
    function haalDoelpuntWeg(team) {
        for (let i = gebeurtenissen.length - 1; i >= 0; i--) {
            if (isDoelpunt(gebeurtenissen[i]) && gebeurtenissen[i].team === team) {
                gebeurtenissen.splice(i, 1);
                break;
            }
        }
        bewaar();
        toonScores();
    }

    function toonScores() {
        const stand = telStand();
        document.getElementById('score-home').textContent = stand.home;
        document.getElementById('score-away').textContent = stand.away;
        werkProfielBij();
        if (matchOverlay.classList.contains('open')) renderOverzicht();
    }

    // ===== TIJD =====
    function klokTijd(ms) {
        const d = new Date(ms);
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    // Speeltijd als mm:ss (bij meer dan 99 minuten loopt het gewoon door)
    function speelTijd(ms) {
        const sec = Math.max(0, Math.floor(ms / 1000));
        return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
    }

    // Gespeelde minuten zoals bij voetbal: 12', 45', 70' (geen uren)
    function minuten(ms) {
        return Math.max(0, Math.floor(ms / 60000)) + "'";
    }

    // Tijd voor een regel in het overzicht: minuut na de start, anders de kloktijd
    function tijdVoor(g) {
        const start = startTijd();
        if (start !== null && g.tijd >= start) return minuten(g.tijd - start);
        return klokTijd(g.tijd);
    }

    function werkKlokBij() {
        const start = startTijd();
        if (start === null) {
            startBtn.textContent = 'Start';
            startBtn.classList.remove('running');
        } else {
            startBtn.textContent = speelTijd(Date.now() - start);
            startBtn.classList.add('running');
        }
        if (matchOverlay.classList.contains('open')) werkMetaBij();
    }

    function werkMetaBij() {
        const start = startTijd();
        document.getElementById('match-meta').textContent = start === null
            ? 'Nog niet gestart'
            : `Gestart om ${klokTijd(start)} · ${minuten(Date.now() - start)}`;
    }

    setInterval(werkKlokBij, 1000);

    startBtn.addEventListener('click', () => {
        if (startTijd() !== null &&
            !confirm('De wedstrijd loopt al. Klok opnieuw starten vanaf nu?')) return;
        gebeurtenissen.push({ type: 'start', tijd: Date.now() });
        bewaar();
        werkKlokBij();
        if (matchOverlay.classList.contains('open')) renderOverzicht();
    });

    // ===== OVERZICHT =====
    // index = plek in gebeurtenissen; null = niet te verwijderen (start)
    function maakRij(klasse, tijdTekst, inhoud, standEl, index = null) {
        const rij = document.createElement('div');
        rij.className = 'goal-row ' + klasse;
        const tijd = document.createElement('span');
        tijd.className = 'time';
        tijd.textContent = tijdTekst;
        const wie = document.createElement('span');
        wie.className = 'who';
        wie.append(...inhoud);
        rij.append(tijd, wie, standEl || document.createElement('span'));

        const item = document.createElement('div');
        item.className = 'goal-item';
        if (index !== null) {
            const bg = document.createElement('div');
            bg.className = 'goal-bg';
            bg.append(span('', 'Verwijderen'));
            item.appendChild(bg);
            maakSwipebaar(item, rij, bg, index);
        }
        item.appendChild(rij);
        return item;
    }

    // ===== SWIPEN OM TE VERWIJDEREN =====
    function maakSwipebaar(item, rij, bg, index) {
        let startX = 0, startY = 0, dx = 0;
        let modus = null; // null = nog niet bepaald, 'swipe' of 'scroll'

        rij.addEventListener('pointerdown', (e) => {
            startX = e.clientX;
            startY = e.clientY;
            dx = 0;
            modus = null;
            rij.classList.remove('snap');
        });

        rij.addEventListener('pointermove', (e) => {
            if (modus === 'scroll' || e.buttons === 0 && e.pointerType === 'mouse') return;
            const mx = e.clientX - startX;
            const my = e.clientY - startY;
            if (modus === null) {
                if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)) {
                    modus = 'swipe';
                    rij.setPointerCapture(e.pointerId);
                } else if (Math.abs(my) > 10) {
                    modus = 'scroll';
                    return;
                } else {
                    return;
                }
            }
            dx = mx;
            rij.style.transform = `translateX(${dx}px)`;
            bg.style.opacity = Math.min(1, Math.abs(dx) / 80);
            bg.style.justifyContent = dx > 0 ? 'flex-start' : 'flex-end';
        });

        const loslaten = () => {
            if (modus !== 'swipe') { modus = null; return; }
            modus = null;
            const drempel = item.offsetWidth * 0.35;
            rij.classList.add('snap');
            if (Math.abs(dx) > drempel) {
                // Regel eruit laten schuiven en verwijderen
                rij.style.transform = `translateX(${dx > 0 ? '' : '-'}110%)`;
                item.style.height = item.offsetHeight + 'px';
                setTimeout(() => {
                    item.classList.add('removing');
                    item.style.height = '0px';
                }, 150);
                setTimeout(() => verwijderGebeurtenis(index), 350);
            } else {
                rij.style.transform = '';
                bg.style.opacity = 0;
            }
        };
        rij.addEventListener('pointerup', loslaten);
        rij.addEventListener('pointercancel', loslaten);
    }

    // Verwijderen met mogelijkheid om het ongedaan te maken
    const undoToast = document.getElementById('undo-toast');
    let laatstVerwijderd = null;
    let undoTimer = null;

    function omschrijving(g) {
        if (g.type === 'wissel') return `Wissel ${g.in} voor ${g.uit}`;
        return g.team === 'away' ? 'Doelpunt tegenstander' : `Doelpunt ${g.naam}`;
    }

    function verwijderGebeurtenis(index) {
        const [weg] = gebeurtenissen.splice(index, 1);
        if (!weg) return;
        laatstVerwijderd = { index, gebeurtenis: weg };
        bewaar();
        toonScores();
        renderOverzicht();

        document.getElementById('undo-text').textContent = omschrijving(weg) + ' verwijderd';
        undoToast.hidden = false;
        clearTimeout(undoTimer);
        undoTimer = setTimeout(verbergUndo, 5000);
    }

    function verbergUndo() {
        undoToast.hidden = true;
        laatstVerwijderd = null;
    }

    document.getElementById('undo-btn').addEventListener('click', () => {
        if (!laatstVerwijderd) return;
        const { index, gebeurtenis } = laatstVerwijderd;
        gebeurtenissen.splice(Math.min(index, gebeurtenissen.length), 0, gebeurtenis);
        bewaar();
        toonScores();
        renderOverzicht();
        clearTimeout(undoTimer);
        verbergUndo();
    });

    function span(klasse, tekst) {
        const el = document.createElement('span');
        if (klasse) el.className = klasse;
        el.textContent = tekst;
        return el;
    }

    // Korfbal-icoon (bal met naden)
    const BAL_ICOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' +
        '<circle cx="12" cy="12" r="9.5"/><path d="M12 2.5v19"/><path d="M2.5 12h19"/>' +
        '<path d="M5.3 5.3c3.6 3.6 3.6 9.8 0 13.4"/><path d="M18.7 5.3c-3.6 3.6-3.6 9.8 0 13.4"/></svg>';

    function renderOverzicht() {
        const eind = telStand();
        document.getElementById('match-nums').textContent = `${eind.home} - ${eind.away}`;
        werkMetaBij();
        goalList.replaceChildren();

        document.getElementById('swipe-hint').hidden =
            !gebeurtenissen.some(g => g.type !== 'start');

        if (gebeurtenissen.length === 0) {
            goalList.appendChild(span('empty', 'Nog niets gebeurd'));
            return;
        }

        const stand = { home: 0, away: 0 };
        const perSpeler = {}; // hoeveel doelpunten iedere Gemini-speler tot dan toe heeft
        gebeurtenissen.forEach((g, i) => {
            if (g.type === 'start') {
                goalList.appendChild(maakRij('event start', klokTijd(g.tijd),
                    [span('icon', '▶'), span('', 'Wedstrijd gestart')]));
                return;
            }

            if (g.type === 'wissel') {
                const tekst = document.createElement('span');
                tekst.append(span('swap', g.in), ' in voor ', span('swap', g.uit));
                goalList.appendChild(maakRij('event', tijdVoor(g),
                    [span('icon', '⇄'), tekst], null, i));
                return;
            }

            // Doelpunt
            stand[g.team]++;
            const dot = span('dot ' + (g.team === 'away' ? 'away' : (g.groep || '')), '');
            const naam = span('naam', g.team === 'away' ? 'Tegenstander' : g.naam);
            const inhoud = [dot, naam];

            // Bij een Gemini-speler: balletje met het hoeveelste doelpunt
            if (g.team === 'home' && g.naam && g.naam !== 'Gemini') {
                perSpeler[g.naam] = (perSpeler[g.naam] || 0) + 1;
                const teller = document.createElement('span');
                teller.className = 'goal-count';
                teller.innerHTML = BAL_ICOON;
                teller.append(String(perSpeler[g.naam]));
                teller.title = `${perSpeler[g.naam]}e doelpunt van ${g.naam}`;
                inhoud.push(teller);
            }

            // Stand na dit doelpunt, de score van wie scoorde vetgedrukt
            const st = document.createElement('span');
            st.className = 'stand';
            const hEl = document.createElement(g.team === 'home' ? 'b' : 'span');
            hEl.textContent = stand.home;
            const aEl = document.createElement(g.team === 'away' ? 'b' : 'span');
            aEl.textContent = stand.away;
            st.append(hEl, ' - ', aEl);

            goalList.appendChild(maakRij(g.team, tijdVoor(g), inhoud, st, i));
        });
    }

    function openOverzicht() {
        renderOverzicht();
        matchOverlay.classList.add('open');
        matchOverlay.setAttribute('aria-hidden', 'false');
        goalList.scrollTop = goalList.scrollHeight; // laatste gebeurtenis in beeld
    }

    function sluitOverzicht() {
        clearTimeout(undoTimer);
        verbergUndo();
        matchOverlay.classList.remove('open');
        matchOverlay.setAttribute('aria-hidden', 'true');
    }

    document.getElementById('match-btn').addEventListener('click', openOverzicht);
    document.getElementById('match-close').addEventListener('click', sluitOverzicht);
    matchOverlay.addEventListener('click', (e) => { if (e.target === matchOverlay) sluitOverzicht(); });

    document.getElementById('reset-btn').addEventListener('click', () => {
        if (!confirm('Wedstrijd resetten? De score, de klok en het hele overzicht worden gewist.')) return;
        gebeurtenissen = [];
        bewaar();
        profielOmgedraaid = false; // nieuwe wedstrijd begint in de aanval
        try { localStorage.setItem('goaltunes-profiel-omgedraaid', '0'); } catch (e) {}
        toonScores();
        werkKlokBij();
    });

    // Handmatig de score aanpassen (tik op het getal = +1, − = laatste doelpunt weghalen)
    document.getElementById('score-home').addEventListener('click', () => voegDoelpuntToe('home', 'Gemini'));
    document.getElementById('score-away').addEventListener('click', () => voegDoelpuntToe('away', 'Tegenstander'));
    document.querySelectorAll('.score-minus').forEach(btn => {
        btn.addEventListener('click', () => haalDoelpuntWeg(btn.dataset.team));
    });

    toonScores();
    werkKlokBij();
</script>

</body>
