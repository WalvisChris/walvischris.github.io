<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEMINI Tools</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #17171b;
      --border: #2a2a30;
      --text: #f2f2f2;
      --muted: #8a8a93;
      --accent: #ffcc00;
      --accent-dark: #e6b800;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at 50% 0%, #1c1a10 0%, var(--bg) 55%);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      padding: 0 16px;
    }

    header {
      width: 100%;
      text-align: center;
      padding: 48px 0 24px;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    h1 .gemini {
      color: var(--accent);
      text-shadow: 0 0 24px rgba(255, 204, 0, 0.35);
    }

    .underline {
      width: 64px;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
      margin: 16px auto 0;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      width: 100%;
      padding-bottom: 80px;
    }

    .btn {
      display: block;
      width: 100%;
      max-width: 320px;
      padding: 18px 24px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--text);
      background: var(--surface);
      border: 2px solid var(--accent);
      border-radius: 12px;
      transition: background 0.2s, color 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .btn:hover,
    .btn:focus-visible {
      background: var(--accent);
      color: #111;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 204, 0, 0.25);
      outline: none;
    }

    .btn:active {
      transform: translateY(0);
      background: var(--accent-dark);
    }
  </style>
</head>
<body>
  <header>
    <h1><span class="gemini">GEMINI</span> Tools</h1>
    <div class="underline"></div>
  </header>

  <main>
    <!-- Vervang de href's door de juiste links -->
    <a class="btn" href="wedstrijden.html">Wedstrijdoverzicht</a>
    <a class="btn" href="goaltunes.html">Goal Tunes</a>
  </main>
</body>
</html>
