<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        /* Dark theme achtergrond en centreren van de inhoud */
        body {
            background-color: #121212;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* Container voor de knoppen (onder elkaar) */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Ruimte tussen de knoppen */
        }

        /* Stijl van de knoppen */
        .btn {
            display: inline-block;
            padding: 15px 40px;
            color: #ffffff; /* Witte tekst */
            text-decoration: none; /* Verwijdert de onderstreping van de link */
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            background-color: transparent; /* Transparante vulling */
            border: 2px solid #6f42c1; /* Paarse outline */
            border-radius: 12px; /* Rounded corners */
            cursor: pointer;
            
            /* Vloeiende overgang voor de animatie */
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        /* Hover effect */
        .btn:hover {
            background-color: #6f42c1; /* Paarse vulling bij hover */
            transform: scale(1.08); /* Knop wordt iets groter */
        }
    </style>
</head>
<body>

    <div class="button-container">
        <a href="wedstrijden.html" class="btn">Wedstrijden</a>
        <a href="uitslagen.html" class="btn">Uitslagen</a>
    </div>

</body>
</html>
