<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedstrijdoverzicht</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Custom fonts voor de afbeeldingen */
        @font-face { font-family: 'GeminiFont';   src: url('./assets/fonts/gemini.ttf')   format('truetype'); }
        @font-face { font-family: 'CairoFont';    src: url('./assets/fonts/cairo.ttf')    format('truetype'); }
        @font-face { font-family: 'HeadlineFont'; src: url('./assets/fonts/headline.ttf') format('truetype'); }

        :root {
            --bg: #0d0d0f;
            --surface: #17171b;
            --surface-2: #1f1f24;
            --input-bg: #111114;
            --border: #2a2a30;
            --text: #f2f2f2;
            --muted: #8a8a93;
            --accent: #fbdc2c;
            --accent-dark: #e0c21a;
            --danger: #e5484d;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 0%, #1c1a10 0%, var(--bg) 55%);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 0 16px 48px;
        }

        /* Kop */
        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 0 4px;
        }
        header h1 {
            margin: 0;
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 800;
        }
        header h1 span { color: var(--accent); }
        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent); }

        /* Kaarten */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            width: 100%;
            max-width: 600px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        h2 { margin: 0; font-size: 1.2rem; font-weight: 700; }

        /* Kalender */
        .cal-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cal-month {
            min-width: 140px;
            text-align: center;
            font-weight: 600;
            text-transform: capitalize;
        }
        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, color 0.2s;
        }
        .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }
        .cal-weekday {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            padding-bottom: 6px;
        }
        .cal-day {
            aspect-ratio: 1;
            max-width: 52px;
            width: 100%;
            margin: 0 auto;
            border-radius: 50%;
            border: 2px solid transparent;
            background: none;
            color: var(--text);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        .cal-day:hover { background: var(--surface-2); }
        .cal-day.today { color: var(--accent); }
        .cal-day.has-match { border-color: var(--accent); }
        .cal-day.selected,
        .cal-day.selected:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #111;
        }
        .cal-empty { aspect-ratio: 1; }

        .cal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
            font-size: 0.85rem;
            color: var(--muted);
            flex-wrap: wrap;
        }
        .legend { display: flex; gap: 14px; align-items: center; }
        .legend i {
            display: inline-block;
            width: 12px; height: 12px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: -1px;
        }
        .legend .l-match { border: 2px solid var(--accent); }
        .legend .l-selected { background: var(--accent); }
        #selected-label { color: var(--text); font-weight: 600; }

        /* Wedstrijdblokken */
        .match-card {
            position: relative;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .match-row { display: flex; gap: 10px; align-items: flex-end; }
        .input-group { flex: 3; display: flex; flex-direction: column; }
        .input-group.team-group { flex: 1; }
        .input-group.time-group { flex: 0 0 140px; }
        .input-group label {
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: var(--muted);
            font-weight: 600;
        }
        input[type="text"], input[type="time"] {
            height: 42px;
            width: 100%;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text);
            font: inherit;
            color-scheme: dark;
            transition: border-color 0.2s;
        }
        input::placeholder { color: #5c5c66; }
        input:focus { outline: none; border-color: var(--accent); }

        /* Knoppen */
        .btn {
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            border-radius: 999px;
            padding: 12px 18px;
            transition: background 0.2s, color 0.2s, transform 0.15s, box-shadow 0.2s;
        }
        .btn:disabled { opacity: 0.6; cursor: wait; }
        .btn-outline {
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
        }
        .btn-outline:hover:not(:disabled) { background: var(--accent); color: #111; }
        .btn-small { padding: 8px 16px; font-size: 0.9rem; }
        .btn-full { width: 100%; }
        .btn-primary {
            background: var(--accent);
            color: #111;
            border: 2px solid var(--accent);
        }
        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(251, 220, 44, 0.25);
        }
        .btn-remove {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--muted);
            cursor: pointer;
            font-weight: 700;
            transition: color 0.2s, border-color 0.2s;
        }
        .btn-remove:hover { color: var(--danger); border-color: var(--danger); }

        /* Preview */
        .preview-card { max-width: 1200px; }
        #canvases-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 18px;
        }
        .canvas-card { display: flex; flex-direction: column; align-items: center; }
        .canvas-card h3 { margin: 0 0 10px; color: var(--muted); font-size: 1rem; }
        canvas {
            width: 280px;
            aspect-ratio: 9 / 16;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #1f1f24;
            cursor: pointer;
        }
        .preview-hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin: -6px 0 16px; }
        .preview-card .btn-primary { display: block; width: 100%; max-width: 360px; margin: 0 auto; }

        @media (max-width: 480px) {
            .card { padding: 16px; }
            .cal-month { min-width: 110px; font-size: 0.95rem; }
            .input-group.time-group { flex: 1; }
        }
    </style>
</head>
<body>

<header>
    <h1><span>Wedstrijd</span>overzicht</h1>
    <a class="back-link" href="index.html">← Terug</a>
</header>

<!-- Kalender -->
<div class="card">
    <div class="card-header">
        <h2>Wedstrijddatum</h2>
        <div class="cal-nav">
            <button type="button" class="icon-btn" id="cal-prev" aria-label="Vorige maand">‹</button>
            <div class="cal-month" id="cal-month"></div>
            <button type="button" class="icon-btn" id="cal-next" aria-label="Volgende maand">›</button>
        </div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-footer">
        <div class="legend">
            <span><i class="l-match"></i>Wedstrijd</span>
            <span><i class="l-selected"></i>Geselecteerd</span>
        </div>
        <span id="selected-label"></span>
    </div>
</div>

<!-- Wedstrijden -->
<div class="card">
    <div class="card-header">
        <h2>Wedstrijden</h2>
        <button type="button" class="btn btn-outline btn-small" id="auto-fill-btn">Automatisch invullen</button>
    </div>

    <datalist id="club-list"></datalist>

    <form id="match-form" onsubmit="return false;">
        <div id="matches-container"></div>
        <button type="button" class="btn btn-outline btn-full" id="add-match-btn">+ Wedstrijd toevoegen</button>
    </form>
</div>

<!-- Preview -->
<div class="card preview-card">
    <div class="card-header">
        <h2>Live preview (9:16)</h2>
        <button type="button" class="btn btn-outline btn-small" id="replay-btn">↻ Opnieuw afspelen</button>
    </div>
    <div id="canvases-wrapper"></div>
    <p class="preview-hint">Klik op een preview om de animatie opnieuw af te spelen. Video's duren 10 seconden.</p>
    <button type="button" class="btn btn-primary" id="download-btn">Alle video's downloaden (MP4)</button>
</div>

<script src="clubs.js"></script>
<!-- MP4-muxer: zet de gecodeerde frames in een .mp4-bestand -->
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js"></script>

<script>
    // ===== CONFIGURATIE =====
    const SPORTLINK_CLIENT_ID = 'NzuwK8DLwE';
    const SPORTLINK_BASE = 'https://data.sportlink.com';
    const DAGEN_VOORUIT = 120; // hoeveel dagen programma ophalen
    const DAGEN_TERUG = 60;    // hoeveel dagen uitslagen ophalen (voor eerdere dagen in de maand)

    // ===== VIDEO / ANIMATIE =====
    const VIDEO_DUUR = 10;             // lengte van de video in seconden
    const FPS = 30;                    // beelden per seconde
    const VIDEO_BITRATE = 6_000_000;   // kwaliteit (bits per seconde)
    const START_VERTRAGING = 0.15;     // even wachten voordat de eerste wedstrijd binnenkomt
    const FADE_DUUR = 0.6;             // duur van één fade-in (sec)
    const VERTRAGING_WEDSTRIJD = 0.2;  // tijd tussen de start van opeenvolgende wedstrijden
    const VERTRAGING_REGEL = 0.07;     // kleine vertraging tussen thuis / gast / tijd+stad
    const SCHUIF_AFSTAND = 220;        // hoeveel px de tekst vanaf links inschuift
    const MAX_PER_PAGINA = 3;

    const container = document.getElementById('matches-container');
    const addButton = document.getElementById('add-match-btn');
    const downloadButton = document.getElementById('download-btn');
    const datalist = document.getElementById('club-list');
    const canvasesWrapper = document.getElementById('canvases-wrapper');
    const autoFillBtn = document.getElementById('auto-fill-btn');
    const calGrid = document.getElementById('cal-grid');
    const calMonth = document.getElementById('cal-month');
    const selectedLabel = document.getElementById('selected-label');

    // ===== DATUM HULPFUNCTIES =====
    function toKey(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function fromKey(key) {
        const [j, m, d] = key.split('-').map(Number);
        return new Date(j, m - 1, d);
    }
    function getEerstvolgendeZaterdag() {
        const v = new Date();
        const z = new Date(v.getFullYear(), v.getMonth(), v.getDate());
        z.setDate(z.getDate() + ((6 - z.getDay() + 7) % 7));
        return z;
    }

    // ===== STATUS =====
    let geselecteerdeDatum = toKey(getEerstvolgendeZaterdag());
    let zichtbareMaand = fromKey(geselecteerdeDatum);
    zichtbareMaand.setDate(1);
    let alleSportlinkWedstrijden = [];   // gecachte API-data
    let wedstrijdDagen = new Set();      // 'YYYY-MM-DD' met minstens één wedstrijd
    let dataGeladen = false;

    // ===== KALENDER =====
    const MAANDEN_VOL = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
    const WEEKDAGEN = ['Ma','Di','Wo','Do','Vr','Za','Zo'];

    function renderKalender() {
        const jaar = zichtbareMaand.getFullYear();
        const maand = zichtbareMaand.getMonth();
        calMonth.textContent = `${MAANDEN_VOL[maand]} ${jaar}`;
        calGrid.innerHTML = '';

        WEEKDAGEN.forEach(w => {
            const el = document.createElement('div');
            el.className = 'cal-weekday';
            el.textContent = w;
            calGrid.appendChild(el);
        });

        const eersteDag = new Date(jaar, maand, 1);
        const offset = (eersteDag.getDay() + 6) % 7; // maandag = 0
        const aantalDagen = new Date(jaar, maand + 1, 0).getDate();
        const vandaagKey = toKey(new Date());

        for (let i = 0; i < offset; i++) {
            const leeg = document.createElement('div');
            leeg.className = 'cal-empty';
            calGrid.appendChild(leeg);
        }

        for (let dag = 1; dag <= aantalDagen; dag++) {
            const key = toKey(new Date(jaar, maand, dag));
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cal-day';
            btn.textContent = dag;
            if (key === vandaagKey) btn.classList.add('today');
            if (wedstrijdDagen.has(key)) btn.classList.add('has-match');
            if (key === geselecteerdeDatum) btn.classList.add('selected');
            btn.addEventListener('click', () => selecteerDatum(key));
            calGrid.appendChild(btn);
        }

        selectedLabel.textContent = getGekozenDatumTekst().toLowerCase().replace(/^\w/, c => c.toUpperCase());
    }

    function selecteerDatum(key) {
        geselecteerdeDatum = key;
        renderKalender();
        updatePreview();
        speelPreviewAf();
    }

    document.getElementById('cal-prev').addEventListener('click', () => {
        zichtbareMaand = new Date(zichtbareMaand.getFullYear(), zichtbareMaand.getMonth() - 1, 1);
        renderKalender();
    });
    document.getElementById('cal-next').addEventListener('click', () => {
        zichtbareMaand = new Date(zichtbareMaand.getFullYear(), zichtbareMaand.getMonth() + 1, 1);
        renderKalender();
    });

    // ===== SPORTLINK DATA =====
    async function haalSportlinkOp(endpoint, aantalDagen) {
        const url = `${SPORTLINK_BASE}/${endpoint}?client_id=${SPORTLINK_CLIENT_ID}&aantaldagen=${aantalDagen}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP fout: ${res.status}`);
        const data = await res.json();
        return Array.isArray(data) ? data : [];
    }

    async function laadWedstrijdDagen() {
        const [programma, uitslagen] = await Promise.allSettled([
            haalSportlinkOp('programma', DAGEN_VOORUIT),
            haalSportlinkOp('uitslagen', DAGEN_TERUG)
        ]);

        if (programma.status === 'rejected') {
            console.error('Programma ophalen mislukt:', programma.reason);
        }

        alleSportlinkWedstrijden = [
            ...(programma.status === 'fulfilled' ? programma.value : []),
            ...(uitslagen.status === 'fulfilled' ? uitslagen.value : [])
        ];

        wedstrijdDagen = new Set(
            alleSportlinkWedstrijden
                .filter(w => w.wedstrijddatum)
                .map(w => w.wedstrijddatum.split('T')[0])
        );
        dataGeladen = programma.status === 'fulfilled';

        // Selecteer de eerstvolgende wedstrijddag (vanaf vandaag), als die er is
        const vandaagKey = toKey(new Date());
        const volgende = [...wedstrijdDagen].filter(k => k >= vandaagKey).sort()[0];
        if (volgende) {
            geselecteerdeDatum = volgende;
            const d = fromKey(volgende);
            zichtbareMaand = new Date(d.getFullYear(), d.getMonth(), 1);
            updatePreview();
        }
        renderKalender();
    }

    // ===== ACHTERGROND & FONTS =====
    const bgImg = new Image();
    bgImg.src = './assets/hemelvaart_9_16.jpg';
    let bgLoaded = false;
    bgImg.onload = () => { bgLoaded = true; updatePreview(); };
    bgImg.onerror = () => {
        console.warn("Kon './assets/hemelvaart_9_16.jpg' niet laden. Fallback achtergrond gebruikt.");
        updatePreview();
    };
    document.fonts.ready.then(updatePreview);

    // ===== CLUBS =====
    if (typeof clubsData !== 'undefined') {
        clubsData.forEach(club => {
            const option = document.createElement('option');
            option.value = `${club.naam} (${club.stad})`;
            datalist.appendChild(option);
        });
    }

    function getSchoneNaam(waarde) {
        if (!waarde) return '';
        if (typeof clubsData !== 'undefined') {
            const club = clubsData.find(c =>
                `${c.naam} (${c.stad})`.toLowerCase() === waarde.toLowerCase() ||
                c.naam.toLowerCase() === waarde.toLowerCase()
            );
            if (club) return club.naam;
        }
        return waarde.replace(/\s*\([^)]*\)$/, '').trim();
    }

    function getStadVanInput(waarde) {
        if (!waarde || typeof clubsData === 'undefined') return '';
        const schoon = getSchoneNaam(waarde).toLowerCase();
        const club = clubsData.find(c =>
            `${c.naam} (${c.stad})`.toLowerCase() === waarde.toLowerCase() ||
            c.naam.toLowerCase() === waarde.toLowerCase() ||
            c.naam.toLowerCase() === schoon
        );
        return club ? club.stad : '';
    }

    // ===== WEDSTRIJDBLOKKEN =====
    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function maakMatchCard(w = {}, verwijderbaar = true) {
        const card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = `
            ${verwijderbaar ? '<button type="button" class="btn-remove" title="Verwijder wedstrijd">✕</button>' : ''}
            <div class="match-row">
                <div class="input-group">
                    <label>Thuis club</label>
                    <input type="text" list="club-list" class="thuis-input" value="${esc(w.thuisClub)}" placeholder="Club/stad">
                </div>
                <div class="input-group team-group">
                    <label>Team</label>
                    <input type="text" class="thuis-team-input" value="${esc(w.thuisTeam)}" placeholder="J1">
                </div>
            </div>
            <div class="match-row">
                <div class="input-group">
                    <label>Gast club</label>
                    <input type="text" list="club-list" class="gast-input" value="${esc(w.gastClub)}" placeholder="Club/stad">
                </div>
                <div class="input-group team-group">
                    <label>Team</label>
                    <input type="text" class="gast-team-input" value="${esc(w.gastTeam)}" placeholder="J1">
                </div>
            </div>
            <div class="match-row">
                <div class="input-group time-group">
                    <label>Tijd</label>
                    <input type="time" class="tijd-input" value="${esc(w.tijd)}">
                </div>
            </div>
        `;
        const rm = card.querySelector('.btn-remove');
        if (rm) rm.addEventListener('click', () => { card.remove(); updatePreview(); });
        return card;
    }

    container.appendChild(maakMatchCard({}, false));
    container.addEventListener('input', updatePreview);
    addButton.addEventListener('click', () => {
        container.appendChild(maakMatchCard());
        updatePreview();
    });

    function splitsClubEnTeam(volledigeNaam) {
        const onderdelen = (volledigeNaam || '').trim().split(' ');
        if (onderdelen.length > 1) {
            const laatste = onderdelen[onderdelen.length - 1];
            if (/^(\d+|[A-Z]\d+)$/i.test(laatste)) {
                return { club: onderdelen.slice(0, -1).join(' '), team: laatste };
            }
        }
        return { club: volledigeNaam || '', team: '' };
    }

    function vulFormulierIn(wedstrijden) {
        container.innerHTML = '';
        wedstrijden.forEach((w, i) => {
            const t = splitsClubEnTeam(w.thuis);
            const g = splitsClubEnTeam(w.gast);
            container.appendChild(maakMatchCard({
                thuisClub: t.club, thuisTeam: t.team,
                gastClub: g.club, gastTeam: g.team,
                tijd: w.tijd
            }, i > 0));
        });
        updatePreview();
        speelPreviewAf();
    }

    // ===== AUTOMATISCH INVULLEN =====
    autoFillBtn.addEventListener('click', async () => {
        const origineel = autoFillBtn.innerText;
        autoFillBtn.innerText = 'Laden...';
        autoFillBtn.disabled = true;
        try {
            if (!dataGeladen) await laadWedstrijdDagen();
            if (!dataGeladen) throw new Error('Sportlink is niet bereikbaar');

            const opDatum = alleSportlinkWedstrijden.filter(item =>
                item.wedstrijddatum && item.wedstrijddatum.split('T')[0] === geselecteerdeDatum
            );

            if (opDatum.length === 0) {
                alert(`Geen wedstrijden gevonden op ${getGekozenDatumTekst().toLowerCase()}.`);
                return;
            }

            opDatum.sort((a, b) => (a.aanvangstijd || '').localeCompare(b.aanvangstijd || ''));
            vulFormulierIn(opDatum.map(item => ({
                thuis: item.thuisteam || '',
                gast: item.uitteam || '',
                tijd: item.aanvangstijd || ''
            })));
        } catch (err) {
            console.error('Fout bij ophalen Sportlink data:', err);
            alert(`Er ging iets mis bij het ophalen van de gegevens: ${err.message}`);
        } finally {
            autoFillBtn.innerText = origineel;
            autoFillBtn.disabled = false;
        }
    });

    // ===== DATUMTEKST =====
    function getGekozenDatumTekst() {
        const d = fromKey(geselecteerdeDatum);
        const dagen = ['ZONDAG','MAANDAG','DINSDAG','WOENSDAG','DONDERDAG','VRIJDAG','ZATERDAG'];
        const maanden = ['JAN','FEB','MAR','APR','MEI','JUN','JUL','AUG','SEP','OKT','NOV','DEC'];
        return `${dagen[d.getDay()]} ${d.getDate()} ${maanden[d.getMonth()]}`;
    }

    // ===== PREVIEW (geanimeerd) =====
    let huidigePaginas = [[]];
    let previewCanvassen = [];
    let previewStart = performance.now();
    let animatieLoopt = false;

    function verzamelWedstrijden() {
        const alleWedstrijden = [];
        document.querySelectorAll('.match-card').forEach(card => {
            const thuisVal = card.querySelector('.thuis-input').value;
            const thuisTeam = card.querySelector('.thuis-team-input').value.trim();
            const gastVal = card.querySelector('.gast-input').value;
            const gastTeam = card.querySelector('.gast-team-input').value.trim();
            const tijdVal = card.querySelector('.tijd-input').value;

            if (thuisVal || gastVal || tijdVal) {
                let thuis = getSchoneNaam(thuisVal);
                let gast = getSchoneNaam(gastVal);
                if (thuis && thuisTeam) thuis += ` ${thuisTeam}`;
                if (gast && gastTeam) gast += ` ${gastTeam}`;
                alleWedstrijden.push({
                    thuis, gast,
                    stad: getStadVanInput(thuisVal) || getStadVanInput(gastVal),
                    tijd: tijdVal
                });
            }
        });
        return alleWedstrijden;
    }

    function updatePreview() {
        const alleWedstrijden = verzamelWedstrijden();
        const paginas = [];
        for (let i = 0; i < alleWedstrijden.length; i += MAX_PER_PAGINA) {
            paginas.push(alleWedstrijden.slice(i, i + MAX_PER_PAGINA));
        }
        if (paginas.length === 0) paginas.push([]);
        huidigePaginas = paginas;

        // Canvassen alleen opnieuw opbouwen als het aantal posts verandert
        if (previewCanvassen.length !== paginas.length) {
            canvasesWrapper.innerHTML = '';
            previewCanvassen = paginas.map((_, idx) => {
                const card = document.createElement('div');
                card.className = 'canvas-card';
                if (paginas.length > 1) {
                    const h = document.createElement('h3');
                    h.innerText = `Video ${idx + 1}`;
                    card.appendChild(h);
                }
                const canvas = document.createElement('canvas');
                canvas.width = 1080;
                canvas.height = 1920;
                canvas.className = 'preview-canvas';
                canvas.title = 'Klik om opnieuw af te spelen';
                canvas.addEventListener('click', speelPreviewAf);
                card.appendChild(canvas);
                canvasesWrapper.appendChild(card);
                return canvas;
            });
        }
        tekenAllePreviews(huidigePreviewTijd());
    }

    function huidigePreviewTijd() {
        return (performance.now() - previewStart) / 1000;
    }

    function animatieEinde() {
        return START_VERTRAGING + (MAX_PER_PAGINA - 1) * VERTRAGING_WEDSTRIJD + 2 * VERTRAGING_REGEL + FADE_DUUR;
    }

    function tekenAllePreviews(t) {
        previewCanvassen.forEach((canvas, i) => {
            tekenFrame(canvas.getContext('2d'), huidigePaginas[i] || [], t);
        });
    }

    function speelPreviewAf() {
        previewStart = performance.now();
        if (animatieLoopt) return;
        animatieLoopt = true;
        const stap = () => {
            const t = huidigePreviewTijd();
            tekenAllePreviews(t);
            if (t < animatieEinde()) requestAnimationFrame(stap);
            else animatieLoopt = false;
        };
        requestAnimationFrame(stap);
    }
    document.getElementById('replay-btn').addEventListener('click', speelPreviewAf);

    // Tekent één volledig beeld (achtergrond + tekst) op tijdstip t (seconden)
    function tekenFrame(ctx, pagina, t) {
        const { width, height } = ctx.canvas;
        ctx.globalAlpha = 1;
        if (bgLoaded) {
            ctx.drawImage(bgImg, 0, 0, width, height);
        } else {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, width, height);
        }
        tekenWedstrijden(ctx, pagina, t);
    }

    function tekenAangepasteTekst(ctx, tekst, x, y, maxBreedte, basisGrootte, fontFamilie, kleur) {
        let grootte = basisGrootte;
        ctx.font = `${grootte}px ${fontFamilie}`;
        while (ctx.measureText(tekst).width > maxBreedte && grootte > 30) {
            grootte -= 2;
            ctx.font = `${grootte}px ${fontFamilie}`;
        }
        ctx.fillStyle = kleur;
        ctx.fillText(tekst, x, y);
    }

    function isGemini(naam) {
        return (naam || '').toUpperCase().includes('GEMINI');
    }

    // 0 → 1 met ease-out, vanaf het moment 'start'
    function voortgang(t, start) {
        const p = Math.min(Math.max((t - start) / FADE_DUUR, 0), 1);
        return 1 - Math.pow(1 - p, 3);
    }

    // Tekent iets met fade + inschuiven vanaf links
    function metFade(ctx, p, tekenFn) {
        if (p <= 0) return;
        ctx.save();
        ctx.globalAlpha = p;
        ctx.translate(-(1 - p) * SCHUIF_AFSTAND, 0);
        tekenFn();
        ctx.restore();
    }

    function tekenWedstrijden(ctx, wedstrijden, t = Infinity) {
        const geminiGeel = '#fbdc2c';
        const midden = ctx.canvas.width / 2;

        // Titel en datum staan stil
        ctx.textAlign = 'center';
        ctx.font = '135px HeadlineFont, Arial';
        ctx.fillStyle = geminiGeel;
        ctx.fillText('Wedstrijden', midden, 210);

        ctx.font = '42px CairoFont, Arial';
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText(getGekozenDatumTekst(), midden, 280);

        if (wedstrijden.length === 0) return;

        ctx.textAlign = 'left';
        const startX = 100, startY = 480, blokHoogte = 440, maxBreedte = 880;

        wedstrijden.forEach((w, idx) => {
            const y = startY + idx * blokHoogte;
            const basis = START_VERTRAGING + idx * VERTRAGING_WEDSTRIJD;

            const tG = isGemini(w.thuis);
            metFade(ctx, voortgang(t, basis), () =>
                tekenAangepasteTekst(ctx, w.thuis, startX, y, maxBreedte, 80,
                    tG ? 'GeminiFont, Arial' : 'CairoFont, Arial', tG ? geminiGeel : '#ffffff'));

            const gG = isGemini(w.gast);
            metFade(ctx, voortgang(t, basis + VERTRAGING_REGEL), () =>
                tekenAangepasteTekst(ctx, w.gast, startX, y + 95, maxBreedte, 80,
                    gG ? 'GeminiFont, Arial' : 'CairoFont, Arial', gG ? geminiGeel : '#ffffff'));

            const details = [w.tijd, w.stad].filter(Boolean);
            if (details.length) {
                metFade(ctx, voortgang(t, basis + 2 * VERTRAGING_REGEL), () => {
                    ctx.font = '42px CairoFont, Arial';
                    ctx.fillStyle = '#e2e8f0';
                    ctx.fillText(details.join(' - '), startX, y + 165);
                });
            }
        });
    }

    // ===== VIDEO RENDEREN =====
    const wacht = ms => new Promise(r => setTimeout(r, ms));

    function maakVideoCanvas() {
        const canvas = document.createElement('canvas');
        canvas.width = 1080;
        canvas.height = 1920;
        return canvas;
    }

    async function kiesEncoderConfig(width, height) {
        // H.264 profielen/levels van hoog naar laag; 1080x1920 heeft minimaal level 4.0 nodig
        const codecs = ['avc1.640033', 'avc1.640032', 'avc1.640028', 'avc1.4d0033', 'avc1.4d0028', 'avc1.42003e', 'avc1.420028'];
        for (const codec of codecs) {
            const config = { codec, width, height, bitrate: VIDEO_BITRATE, framerate: FPS };
            try {
                const res = await VideoEncoder.isConfigSupported(config);
                if (res.supported) return config;
            } catch (e) { /* volgende proberen */ }
        }
        return null;
    }

    // Snelste en nauwkeurigste route: WebCodecs (Chrome, Edge, Safari, nieuwe Firefox)
    async function renderMetWebCodecs(pagina, onVoortgang) {
        const canvas = maakVideoCanvas();
        const ctx = canvas.getContext('2d');
        const config = await kiesEncoderConfig(canvas.width, canvas.height);
        if (!config) throw new Error('Geen H.264-encoder beschikbaar');

        const muxer = new Mp4Muxer.Muxer({
            target: new Mp4Muxer.ArrayBufferTarget(),
            video: { codec: 'avc', width: canvas.width, height: canvas.height, frameRate: FPS },
            fastStart: 'in-memory'
        });

        let encoderFout = null;
        const encoder = new VideoEncoder({
            output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
            error: e => { encoderFout = e; }
        });
        encoder.configure(config);

        const totaalFrames = VIDEO_DUUR * FPS;
        const frameDuur = 1e6 / FPS; // microseconden
        for (let i = 0; i < totaalFrames; i++) {
            if (encoderFout) throw encoderFout;
            tekenFrame(ctx, pagina, i / FPS);
            const frame = new VideoFrame(canvas, {
                timestamp: Math.round(i * frameDuur),
                duration: Math.round(frameDuur)
            });
            encoder.encode(frame, { keyFrame: i % (FPS * 2) === 0 });
            frame.close();

            while (encoder.encodeQueueSize > 8) await wacht(2);
            if (i % 10 === 0) { onVoortgang(i / totaalFrames); await wacht(0); }
        }
        await encoder.flush();
        if (encoderFout) throw encoderFout;
        encoder.close();
        muxer.finalize();
        onVoortgang(1);
        return { blob: new Blob([muxer.target.buffer], { type: 'video/mp4' }), ext: 'mp4' };
    }

    // Terugvaloptie: realtime opnemen met MediaRecorder (duurt 10 sec per video)
    async function renderMetMediaRecorder(pagina, onVoortgang) {
        const canvas = maakVideoCanvas();
        const ctx = canvas.getContext('2d');
        tekenFrame(ctx, pagina, 0);

        const types = ['video/mp4;codecs=avc1.640033', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
        const mimeType = typeof MediaRecorder !== 'undefined' && types.find(t => MediaRecorder.isTypeSupported(t));
        if (!mimeType) throw new Error('Deze browser kan geen video maken. Gebruik Chrome, Edge of Safari.');

        const stream = canvas.captureStream(FPS);
        const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: VIDEO_BITRATE });
        const stukken = [];
        recorder.ondataavailable = e => { if (e.data.size) stukken.push(e.data); };
        const gestopt = new Promise(r => { recorder.onstop = r; });

        recorder.start(250);
        const start = performance.now();
        await new Promise(resolve => {
            const stap = () => {
                const t = (performance.now() - start) / 1000;
                tekenFrame(ctx, pagina, Math.min(t, VIDEO_DUUR));
                onVoortgang(Math.min(t / VIDEO_DUUR, 1));
                if (t < VIDEO_DUUR) requestAnimationFrame(stap); else resolve();
            };
            requestAnimationFrame(stap);
        });
        recorder.stop();
        await gestopt;
        stream.getTracks().forEach(tr => tr.stop());
        return { blob: new Blob(stukken, { type: mimeType }), ext: mimeType.startsWith('video/mp4') ? 'mp4' : 'webm' };
    }

    async function renderVideo(pagina, onVoortgang) {
        const kanWebCodecs = typeof VideoEncoder !== 'undefined' && typeof VideoFrame !== 'undefined' && typeof Mp4Muxer !== 'undefined';
        if (kanWebCodecs) {
            try {
                return await renderMetWebCodecs(pagina, onVoortgang);
            } catch (err) {
                console.warn('WebCodecs mislukt, terugval op MediaRecorder:', err);
            }
        }
        return renderMetMediaRecorder(pagina, onVoortgang);
    }

    function downloadBlob(blob, bestandsnaam) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = bestandsnaam;
        link.href = url;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    // ===== DOWNLOAD =====
    downloadButton.addEventListener('click', async () => {
        const origineel = downloadButton.innerText;
        downloadButton.disabled = true;
        const paginas = huidigePaginas.slice();
        const v = new Date();
        const datumString = `${String(v.getDate()).padStart(2, '0')}.${String(v.getMonth() + 1).padStart(2, '0')}.${v.getFullYear()}`;
        let webmGebruikt = false;
        try {
            for (let i = 0; i < paginas.length; i++) {
                const label = paginas.length > 1 ? `Video ${i + 1}/${paginas.length} maken… ` : 'Video maken… ';
                const resultaat = await renderVideo(paginas[i], p => {
                    downloadButton.innerText = `${label}${Math.round(p * 100)}%`;
                });
                if (resultaat.ext !== 'mp4') webmGebruikt = true;
                downloadBlob(resultaat.blob, `gemini_wedstrijden_${datumString}_${i + 1}.${resultaat.ext}`);
                await wacht(300);
            }
            if (webmGebruikt) {
                alert('Let op: deze browser kan geen MP4 maken, de video is als WebM opgeslagen. Gebruik Chrome, Edge of Safari voor MP4.');
            }
        } catch (err) {
            console.error('Fout bij maken video:', err);
            alert(`Er ging iets mis bij het maken van de video: ${err.message}`);
        } finally {
            downloadButton.innerText = origineel;
            downloadButton.disabled = false;
        }
    });

    // ===== START =====
    renderKalender();
    updatePreview();
    speelPreviewAf();
    laadWedstrijdDagen().catch(err => console.error(err));
</script>
