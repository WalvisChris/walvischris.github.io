<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fingerprint Hack - Cayo Perico Prototype</title>
    <style>
        body {
            /* Achtergrond in stijl van de eerdere pagina */
            background-color: #121212;
            background-image: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            color: white;
            font-family: 'Courier New', Courier, monospace; /* Meer 'hacker' stijl */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        h2 {
            color: #2ecc71;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }

        .hack-container {
            border: 4px solid #2ecc71;
            padding: 15px;
            background-color: rgba(40, 167, 69, 0.1);
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .slice {
            width: 250px;
            height: 45px;
            border: 2px solid #2ecc71;
            background-color: rgba(40, 167, 69, 0.4); /* Donkergroene vulling */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            transition: all 0.15s ease;
            position: relative;
        }

        /* Wanneer een balk geselecteerd is (wit) */
        .slice.selected {
            background-color: #ffffff;
            color: #121212;
            border-color: #ffffff;
            transform: scale(1.05);
            z-index: 2;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        .controls-hint {
            margin-top: 30px;
            color: #888;
            font-size: 0.9em;
            text-align: center;
            line-height: 1.6;
        }

        .status {
            margin-top: 15px;
            font-weight: bold;
            height: 20px;
        }

        .success {
            color: #2ecc71;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <h2>Fingerprint ID Scanner</h2>

    <div class="hack-container" id="hack-container">
        <!-- Wordt gevuld door JS -->
    </div>

    <div id="status" class="status"></div>

    <div class="controls-hint">
        GEBRUIK DE PIJLTOETSEN<br>
        OMHOOG/OMLAAG: Selecteer vlak | LINKS/RECHTS: Verander waarde
    </div>

    <script>
        const container = document.getElementById('hack-container');
        const statusDisplay = document.getElementById('status');
        const numSlices = 8;
        let selectedIndex = 0;
        
        // De 'oplossing' is 0, 1, 2, 3, 4, 5, 6, 7
        let currentValues = [];

        // 1. Initialiseer met geshuffelde waarden
        function initGame() {
            // Maak een array [0,1,2,3,4,5,6,7] en shuffle deze
            let vals = Array.from({length: numSlices}, (_, i) => i);
            for (let i = vals.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [vals[i], vals[j]] = [vals[j], vals[i]];
            }
            currentValues = vals;
            render();
        }

        // 2. Teken de vlakken
        function render() {
            container.innerHTML = '';
            let isCorrect = true;

            for (let i = 0; i < numSlices; i++) {
                const div = document.createElement('div');
                div.classList.add('slice');
                if (i === selectedIndex) div.classList.add('selected');
                
                div.textContent = currentValues[i];
                container.appendChild(div);

                // Check of deze specifiek op de juiste plek staat (voor de win-conditie)
                if (currentValues[i] !== i) {
                    isCorrect = false;
                }
            }

            if (isCorrect) {
                statusDisplay.textContent = "ACCESS GRANTED";
                statusDisplay.className = "status success";
            } else {
                statusDisplay.textContent = "";
                statusDisplay.className = "status";
            }
        }

        // 3. Toetsenbord besturing
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    selectedIndex = (selectedIndex - 1 + numSlices) % numSlices;
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    selectedIndex = (selectedIndex + 1) % numSlices;
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    currentValues[selectedIndex] = (currentValues[selectedIndex] - 1 + numSlices) % numSlices;
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    currentValues[selectedIndex] = (currentValues[selectedIndex] + 1) % numSlices;
                    break;
            }
            render();
        });

        initGame();
    </script>
</body>
</html>
