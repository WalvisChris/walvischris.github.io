<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cayo Perico Heist</title>
    <style>
        body {
            /* Je eigen achtergrond */
            background-image: url('assets/background.jpg'); 
            background-color: #121212; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* De grote hoekige knop */
        .btn {
            background-color: #e67f0088;
            color: white;
            border: 4px solid #ff8c00;
            padding: 25px 60px;
            font-size: 24px;
            text-transform: uppercase;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            display: inline-block;
            border-radius: 0; 
            transition: transform 0.2s;
            cursor: pointer;
            z-index: 10;
        }

        .btn:hover {
            transform: scale(1.3);
        }

        /* Container voor Pavel en de tekst */
        .pavel-container {
            position: absolute;
            bottom: 0;
            left: 0;
            /* Breedte van de container bepaalt wanneer de tekst ombuigt */
            width: 500px; 
            display: flex;
            flex-direction: column;
            z-index: 5;
        }

        /* De tekst boven Pavel */
        .pavel-text {
            color: white;
            font-size: 22px;
            font-weight: bold;
            /* Zorgt dat tekst over de hele breedte van de container mag lopen */
            width: 100%; 
            /* Ruimte aan de onderkant van de tekst, boven pavel */
            margin-bottom: 20px; 
            padding-left: 20px; /* Zodat de tekst niet strak tegen de linkerkant plakt */
            box-sizing: border-box;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            line-height: 1.4; /* Zorgt voor mooie ruimte tussen de regels */
        }

        /* De afbeelding van Pavel */
        .pavel-img {
            width: 100%; /* Neemt de 500px van de container over */
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <a href="cayo.html" class="btn">Cayo Perico Heist</a>

    <div class="pavel-container">
        <!-- De tekst breekt nu af bij de rand van de afbeelding -->
        <div class="pavel-text">"Wat willen jullie horen dan? Kanker honden!"</div>
        <img src="assets/pavel.png" alt="Pavel" class="pavel-img">
    </div>

</body>
</html>
