<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekentool - Walvischris</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #333; }
        .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        label { flex: 1; font-weight: bold; }
        .price { color: #666; font-size: 0.9rem; margin-right: 10px; }
        input { width: 60px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
        .total-section { border-top: 2px solid #eee; margin-top: 20px; padding-top: 15px; font-size: 1.2rem; font-weight: bold; display: flex; justify-content: space-between; }
        .euro { color: #2c3e50; }
    </style>
</head>
<body>

<div class="card">
    <h1>Secondary Targets</h1>

    <!-- Item 1: Cash -->
    <div class="row">
        <label>Cash</label>
        <span class="info-text">Min: 78k | Max: 89k</span>
        <input type="number" class="amount" 
               data-min="78480" data-max="89420" 
               value="0" min="0" oninput="calculate()">
    </div>

    <!-- Item 2: Artwork -->
    <div class="row">
        <label>Artwork</label>
        <span class="info-text">Min: 176k | Max: 199k</span>
        <input type="number" class="amount" 
               data-min="176200" data-max="199700" 
               value="0" min="0" oninput="calculate()">
    </div>

    <!-- Item 3: Wood -->
    <div class="row">
        <label>Wood</label>
        <span class="info-text">Min: 145k | Max: 149k</span>
        <input type="number" class="amount" 
               data-min="145980" data-max="149265" 
               value="0" min="0" oninput="calculate()">
    </div>

    <!-- Item 4: Coke -->
    <div class="row">
        <label>Coke</label>
        <span class="info-text">Min: 220k | Max: 255k</span>
        <input type="number" class="amount" 
               data-min="220500" data-max="255000" 
               value="0" min="0" oninput="calculate()">
    </div>

    <!-- Item 5: Gold -->
    <div class="row">
        <label>Gold</label>
        <span class="info-text">Min: 328k | Max: 333k</span>
        <input type="number" class="amount" 
               data-min="328584" data-max="333192" 
               value="0" min="0" oninput="calculate()">
    </div>

    <div class="results-container">
        <div class="total-row">
            <span class="label-text">Totaal Minimaal:</span>
            <span class="value-text">€ <span id="total-min">0</span></span>
        </div>
        <div class="total-row">
            <span class="label-text">Totaal Maximaal:</span>
            <span class="value-text">€ <span id="total-max">0</span></span>
        </div>
        <div class="total-row grand-total">
            <span class="label-text">Gemiddeld:</span>
            <span class="value-text">€ <span id="total-avg">0</span></span>
        </div>
    </div>
</div>

<script>
    function calculate() {
        let totalMin = 0;
        let totalMax = 0;
        
        const inputs = document.querySelectorAll('.amount');
        
        inputs.forEach(input => {
            const minPrice = parseFloat(input.getAttribute('data-min'));
            const maxPrice = parseFloat(input.getAttribute('data-max'));
            const count = parseInt(input.value) || 0;
            
            totalMin += minPrice * count;
            totalMax += maxPrice * count;
        });

        const avg = (totalMin + totalMax) / 2;

        document.getElementById('total-min').innerText = totalMin.toLocaleString('nl-NL');
        document.getElementById('total-max').innerText = totalMax.toLocaleString('nl-NL');
        document.getElementById('total-avg').innerText = Math.round(avg).toLocaleString('nl-NL');
    }
</script>

</body>
</html>
