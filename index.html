<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cayo Perico Heist</title>
    <style>
        body {
            background-color: #121212; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .button-container {
            display: flex;
            flex-direction: column; /* Zet ze onder elkaar */
            gap: 20px;              /* Ruimte tussen de knoppen */
            align-items: center;
        }

        .btn {
            color: white;
            padding: 25px 60px;
            font-size: 24px;
            text-transform: uppercase;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            display: inline-block;
            border-radius: 0; 
            transition: transform 0.2s;
            cursor: pointer;
            z-index: 10;
            min-width: 300px;
        }

        .btn-orange {
            background-color: #e67f0088;
            border: 4px solid #ff8c00;
        }

        .btn-green {
            background-color: #28a74588;
            border: 4px solid #2ecc71;
        }

        .btn-blue {
            background-color: #007bff88;
            border: 4px solid #007bff;
        }

        .btn:hover {
            transform: scale(1.3);
        }

    </style>
</head>
<body>

    <div class="button-container">
        <a href="cayo.html" class="btn btn-orange">Cayo Perico Heist</a>
        <a href="fingerprint.html" class="btn btn-green">Hack Fingerprint</a>
        <a href="dfir.html" class="btn btn-blue">DFIR text</a>
    </div>

</body>
</html>
