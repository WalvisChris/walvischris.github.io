<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cayo Perico Heist</title>
    <style>
        body {
            /* Je eigen achtergrond */
            background-image: url('assets/background.jpg'); 
            background-color: #121212; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* De grote hoekige knop */
        .btn {
            background-color: #e67f0088;
            color: white;
            border: 4px solid #ff8c00;
            padding: 25px 60px;
            font-size: 24px;
            text-transform: uppercase;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            display: inline-block;
            border-radius: 0; 
            transition: transform 0.2s;
            cursor: pointer;
            z-index: 10;
        }

        .btn:hover {
            transform: scale(1.3);
        }

    </style>
</head>
<body>
    <a href="cayo.html" class="btn">Cayo Perico Heist</a>
</body>
</html>
